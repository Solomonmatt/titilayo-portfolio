  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #14213d;
      --muted: #5f6f8f;
      --primary: #2448ff;
      --accent: #7c3aed;
      --border: rgba(20, 33, 61, 0.12);
      --shadow: 0 20px 45px rgba(20, 33, 61, 0.12);
    }

    body.dark {
      --bg: #07111f;
      --surface: rgba(8, 15, 31, 0.82);
      --text: #f8fafc;
      --muted: #b3c2d9;
      --primary: #7c9bff;
      --accent: #b08cff;
      --border: rgba(255,255,255,0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fbff 0%, #edf3ff 100%);
      color: var(--text);
      line-height: 1.7;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.dark {
      background: linear-gradient(135deg, #030711 0%, #0d1729 100%);
    }

    a { color: inherit; text-decoration: none; }
    .container { width: min(960px, calc(100% - 2rem)); margin: 0 auto; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    body.dark .navbar {
      background: rgba(7, 12, 24, 0.78);
    }

    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      font-weight: 700;
    }

    .brand img {
      width: 92px;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 0;
      border: none;
      filter: none;
      background: transparent;
      padding: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      border-radius: 999px;
      padding: 0.92rem 1.28rem;
      min-height: 46px;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 16px 35px rgba(36, 72, 255, 0.24), inset 0 1px 0 rgba(255,255,255,0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(36, 72, 255, 0.18);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.72);
      color: var(--text);
      border-color: rgba(255,255,255,0.7);
      box-shadow: 0 12px 30px rgba(20, 33, 61, 0.08);
    }

    main {
      padding: 3rem 0 4rem;
    }

    .hero-card,
    .contact-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(241,246,255,0.85));
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 30px;
      box-shadow: 0 24px 60px rgba(20, 33, 61, 0.10);
      padding: 1.6rem;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .hero-card:hover,
    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 55px rgba(20, 33, 61, 0.18);
    }

    body.dark .hero-card,
    body.dark .contact-card {
      background: rgba(10, 18, 37, 0.8);
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.24);
    }

    .hero-card {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1.25rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .hero-card h1 { font-size: clamp(1.8rem, 2.8vw, 2.4rem); margin: 0 0 0.7rem; letter-spacing: -0.02em; }
    .hero-card p { color: var(--muted); }

    .hero-slideshow {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(20, 33, 61, 0.16);
      background: rgba(255,255,255,0.6);
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .hero-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .hero-dots {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.45rem;
    }

    .hero-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.7);
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .hero-dot.active {
      background: white;
      transform: scale(1.15);
    }

    .contact-card form {
      display: grid;
      gap: 0.9rem;
    }

    label { font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      font: inherit;
      background: rgba(255,255,255,0.72);
      color: var(--text);
    }

    body.dark input,
    body.dark textarea {
      background: rgba(255,255,255,0.06);
    }

    textarea { min-height: 130px; resize: vertical; }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.8rem;
    }

    .contact-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
      font-weight: 600;
    }

    .form-success {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.8rem 0.95rem;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.12);
      color: #166534;
      border: 1px solid rgba(34, 197, 94, 0.24);
      font-weight: 600;
    }

    body.dark .form-success {
      color: #bbf7d0;
      background: rgba(34, 197, 94, 0.16);
      border-color: rgba(34, 197, 94, 0.3);
    }

    footer {
      padding-bottom: 2rem;
      color: var(--muted);
      text-align: center;
    }

    .theme-toggle {
      border: none;
      background: var(--surface);
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 22px rgba(36,72,255,0.12);
      margin-left: 0.6rem;
    }

    @media (max-width: 720px) {
      .hero-card { grid-template-columns: 1fr; }
      .hero-card img { height: 260px; }
    }
  </style>
</head>
<body class="dark">
  <nav class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <img src="logo footer.png" alt="Logo" />
      </a>
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"><i class="fas fa-sun"></i></button>
        <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">
      <section class="hero-card">
        <div>
          <h1>Let’s connect</h1>
          <p>Thank you for visiting. I’m always interested in meaningful collaborations, speaking opportunities, mentorship initiatives, and strategic partnerships.</p>
          <div class="contact-links">
            <a href="mailto:jaiyesimititilayo@gmail.com"><i class="fa-solid fa-paper-plane"></i> jaiyesimititilayo@gmail.com</a>
            <a href="https://wa.link/l8d9wp" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a href="https://linkedin.com/in/titilayo-jaiyesimi" target="_blank"><i class="fa-brands fa-linkedin-in"></i> LinkedIn</a>
          </div>
        </div>
        <div class="hero-slideshow">
          <img class="hero-slide active" src="NEW 1.jpeg" alt="Titilayo Jaiyesimi" />
          <img class="hero-slide" src="NEW 2.jpeg" alt="Titilayo Jaiyesimi" />
          <div class="hero-dots">
            <button class="hero-dot active" data-slide="0" aria-label="Show slide 1"></button>
            <button class="hero-dot" data-slide="1" aria-label="Show slide 2"></button>
          </div>
        </div>
      </section>

      <section class="contact-card">
        <form id="contact-form" action="https://formspree.io/f/xpwbwjjk" method="POST">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="your@email.com" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell me a little about your project or idea" required></textarea>

          <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Send message</button>
          <div class="form-success"><i class="fa-solid fa-circle-check"></i> Thank you! Your message has been sent.</div>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">© 2026 Titilayo Jaiyesimi</div>
  </footer>
  <script>
    async function handleFormSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const success = form.querySelector('.form-success');
      if (success) {
        success.style.display = 'flex';
      }

      const formData = new FormData(form);
      try {
        const response = await fetch(form.action, {
          method: form.method,
          headers: { Accept: 'application/json' },
          body: formData
        });

        if (!response.ok) throw new Error('Submission failed');
        form.reset();
      } catch (error) {
        const name = formData.get('name') || 'there';
        const email = formData.get('email') || '';
        const message = formData.get('message') || '';
        const subject = encodeURIComponent('New contact message');
        const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
        window.location.href = `mailto:jaiyesimititilayo@gmail.com?subject=${subject}&body=${body}`;
      }
    }

    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', handleFormSubmit);
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const icon = document.querySelector('.theme-toggle i');
      icon.className = document.body.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
    }

    const heroSlides = Array.from(document.querySelectorAll('.hero-slide'));
    const heroDots = Array.from(document.querySelectorAll('.hero-dot'));
    let heroIndex = 0;

    function showHeroSlide(index) {
      heroIndex = (index + heroSlides.length) % heroSlides.length;
      heroSlides.forEach((slide, i) => slide.classList.toggle('active', i === heroIndex));
      heroDots.forEach((dot, i) => dot.classList.toggle('active', i === heroIndex));
    }

    if (heroSlides.length) {
      setInterval(() => showHeroSlide(heroIndex + 1), 5000);
      heroDots.forEach(dot => {
        dot.addEventListener('click', () => showHeroSlide(Number(dot.dataset.slide)));
      });
    }
  </script>
</body>
